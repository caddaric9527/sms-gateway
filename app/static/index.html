<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>短信网关</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%233f8cff'/><path d='M28 34h44a6 6 0 016 6v22a6 6 0 01-6 6H46l-12 9v-9h-6a6 6 0 01-6-6V40a6 6 0 016-6z' fill='white'/></svg>">
</head>
<body>

<!-- 登录 -->
<div id="login" class="login-wrap hidden">
  <form class="login-card" id="login-form">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
      </svg>
    </div>
    <h1>短信网关</h1>
    <p>请输入访问密码</p>
    <div class="field"><input type="password" id="login-password" placeholder="密码" autocomplete="current-password" required></div>
    <button class="btn primary" type="submit" style="width:100%;justify-content:center">进入</button>
  </form>
</div>

<!-- 主界面 -->
<div class="app hidden" id="app">

  <!-- 侧栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
        </svg>
      </div>
      <div>
        <div class="brand-title" id="site-title">短信网关</div>
        <div class="brand-sub" id="brand-sub">Air780EPM</div>
      </div>
    </div>

    <nav class="nav">
      <button data-view="sms" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16v12H7l-3 3V4z"/></svg>
        短信
      </button>
      <button data-view="rules">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="12" r="2"/><circle cx="15" cy="18" r="2"/></svg>
        转发
      </button>
      <button data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008.9 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 8.9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6 1.65 1.65 0 0010 3.09V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9v0a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        设置
      </button>
      <button data-view="logs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        日志
      </button>
    </nav>

    <div class="sidebar-search" id="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" placeholder="搜索短信 / 号码" autocomplete="off">
    </div>

    <div class="thread-list" id="thread-list"></div>

    <div class="status-card">
      <div class="device-list" id="device-list">
        <div class="device-item">
          <div class="device-top">
            <i class="status-dot"></i><span class="device-name">等待模块…</span>
          </div>
        </div>
      </div>
      <div class="status-row device-sync">
        <span class="status-label">最近同步</span>
        <span class="status-value" id="st-sync">—</span>
      </div>
    </div>
  </aside>

  <!-- 主区 -->
  <main class="main">
    <header class="topbar">
      <div>
        <div class="topbar-title" id="top-title">短信</div>
        <div class="topbar-sub" id="top-sub"></div>
      </div>
      <div class="topbar-actions">
        <button class="btn ghost sm desktop-only" id="btn-refresh" title="重新同步">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 11-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          同步
        </button>
        <button class="btn primary sm" id="btn-compose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          新短信
        </button>
      </div>
    </header>

    <!-- 视图容器 -->
    <div class="chat" id="chat-view"></div>
    <div class="composer" id="composer">
      <div class="composer-inner">
        <textarea id="msg-input" rows="1" placeholder="输入短信内容，Enter 发送，Shift+Enter 换行"></textarea>
        <button class="btn primary" id="btn-send" style="height:44px;padding:0 20px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          发送
        </button>
      </div>
      <div class="composer-foot">
        <span id="compose-count">0 字</span>
        <label class="compose-device hidden" id="compose-device-wrap">
          <span>从</span><select id="compose-device"></select><span>发送</span>
        </label>
        <span id="compose-hint">长短信自动分片</span>
      </div>
    </div>

    <div class="panel-view hidden" id="panel-view"></div>
  </main>
</div>

<!-- 弹窗 -->
<div class="modal-mask" id="modal-mask">
  <div class="modal">
    <div class="modal-head">
      <span id="modal-title">标题</span>
      <button class="btn ghost sm" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<div id="toast-wrap"></div>
<script src="/app.js"></script>
</body>
</html>
